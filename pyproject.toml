[project]
name = "octodig"
version = "0.1.0"
description = "Evidence-backed B2B research application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langchain-google-genai>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "PyJWT>=2.9",
  "pwdlib[argon2]>=0.2",
  "email-validator>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
