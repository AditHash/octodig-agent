services:
  api:
    build: .
    env_file: .env
    command: uvicorn octodig.api:app --host 0.0.0.0 --port 8000
    environment:
      OCTODIG_ENVIRONMENT: production
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    command: python -m octodig.worker
    environment:
      OCTODIG_ENVIRONMENT: production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${OCTODIG_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    restart: unless-stopped
