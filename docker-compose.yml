services:
  api:
    build: .
    env_file: .env
    command: uvicorn octodig.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: python -m octodig.worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${OCTODIG_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    restart: unless-stopped
